<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Changeify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <link rel="stylesheet" href="lib/styles.css">
</head>
<body>
    <h2>Changeify</h2>
    <button id="addPerson">Add person</button>
    <div id="people"></div>
    <section id="changeSummary" aria-live="polite" hidden>
        <h3>Change summary receipt</h3>
        <div class="summaryPeople"></div>
        <button id="saveReceipt" type="button">Save receipt as picture</button>
        <p id="receiptStatus" role="status"></p>
    </section>
    <script src="lib/script.js"></script>
</body>
</html>
